name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check format
        run: ruff format --check .
      - name: Unit and API smoke tests
        run: python -m pytest
      - name: Import smoke
        run: python -c "from app.main import app; from ui.streamlit_app import fetch_api_health; print(app.title)"
