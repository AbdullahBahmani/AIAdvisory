# Local demo only: each host port binds to loopback; no hosted runners.
services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/aiadvisory.sqlite3
      ADVISORY_AI_ENABLED: "0"
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    security_opt:
      - no-new-privileges:true
  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  app-data:
