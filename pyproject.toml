[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-opportunity-advisor"
version = "0.8.0"
description = "Human-led AI opportunity assessment and advisory platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query()/Body() in argument defaults is the framework's
# documented idiom; B008 flags it but rewriting it would break dependency injection.
"app/api/*.py" = ["B008"]
"app/main.py" = ["B008"]
"app/security.py" = ["B008"]
# Pytest fixture parameters intentionally shadow module-level imports
# (e.g. `client`); F811 is a false positive here.
"tests/*.py" = ["F811"]
